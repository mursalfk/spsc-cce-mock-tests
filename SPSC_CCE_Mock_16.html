<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
h2{font:700 20px/1.2 Georgia,serif;margin:24px 0 10px}
h3{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

ul{margin:0;padding-left:20px}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:9px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:6px 12px;font-size:14px}
button:disabled{opacity:.6;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.top .ti{font-weight:700;flex:1;min-width:140px}
.tm{font:700 20px ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.tm.low{color:var(--bad)}
.body{display:grid;grid-template-columns:1fr 300px;gap:16px;max-width:1100px;margin:0 auto;padding:16px}
@media (max-width:860px){.body{grid-template-columns:1fr}}
.meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut);margin-bottom:10px;flex-wrap:wrap}
.tag{background:var(--acc2);color:var(--acc);padding:2px 9px;border-radius:99px;font-weight:600}
.flag{color:var(--warn);font-weight:600}
.q{font-size:19px;line-height:1.5;margin:0 0 14px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;text-align:left;align-items:flex-start;width:100%}
.opt b{min-width:24px;height:24px;border-radius:50%;background:var(--acc2);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.sel b{background:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.expl{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--acc2);font-size:15px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav .sp{flex:1}
#pal{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
@media (max-width:860px){#pal{position:static;max-height:none}}
.ph{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.pb{padding:5px 0;font-size:13px;text-align:center;border-radius:7px;font-variant-numeric:tabular-nums}
.pb.a{background:var(--okbg);border-color:var(--ok)}
.pb.m{box-shadow:inset 0 0 0 2px var(--warn)}
.pb.c{outline:2px solid var(--acc);outline-offset:1px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:12px}
.big{font:700 44px/1 Georgia,serif}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--acc2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rv{border-left:4px solid var(--line)}
.rv.ok{border-left-color:var(--ok)}.rv.bad{border-left-color:var(--bad)}.rv.un{border-left-color:var(--warn)}
.rv .q{font-size:16px;margin-bottom:8px}
.rv .ans{font-size:14px;margin:2px 0}
.fc{min-height:260px;display:flex;flex-direction:column;justify-content:center}
.fc .q{font-size:22px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--acc)}
.warn{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:9px;font-size:14px;margin:8px 0}
a{color:var(--acc)}
</style>
</head>

  });
  h += '</div>';
  if(lock) h += `<div class="expl"><b>${picked === q.a ? 'Correct.' : 'Correct answer: ' + L[q.a] + '.'}</b> ${esc(q.e || '')}</div>`;
  $('#qc').innerHTML = h;
  $('#nv').innerHTML = `<button data-a="prev"${i === 0 ? ' disabled' : ''}>← Previous</button>
    ${study ? '' : `<button data-a="clear">Clear answer</button><button data-a="mark">${S.mk[i] ? 'Unmark' : '★ Mark for review'}</button>`}
    <span class="sp"></span><button class="pri" data-a="next"${i === N - 1 ? ' disabled' : ''}>Next →</button>`;
}
function renderPal(){
  let h = '', a = 0;
  S.ans.forEach(x => { if(x >= 0) a++; });
  T.sec.forEach(s => {
    h += `<div class="ph">${esc(s.name)}</div><div class="pg">`;
    for(let i = s.i0; i < s.i0 + s.n; i++){
      let c = 'pb'; if(S.ans[i] >= 0) c += ' a'; if(S.mk[i]) c += ' m'; if(i === S.cur) c += ' c';
      h += `<button class="${c}" data-a="go" data-i="${i}">${i + 1}</button>`;
    }
    h += '</div>';
  });
  h += '<div class="leg"><span>■ green = answered</span><span>▢ amber ring = marked</span></div>';
  $('#pal').innerHTML = h;
  $('#prog').textContent = `Answered ${a}/${N}`;
}
function pick(k){
  const i = S.cur, q = T.q[i];
  if(S.mode === 'study' && S.ans[i] >= 0) return;
  S.ans[i] = (S.mode === 'exam' && S.ans[i] === k) ? -1 : k;
  save(); renderQ(); renderPal();
}
function go(i){ S.cur = Math.max(0, Math.min(N - 1, i)); save(); renderQ(); renderPal(); }

/* ---------- finish + result ---------- */
function finish(auto){
  if(!auto){
    const r = score();
    if(!confirm(`${r.u} question(s) unanswered. Submit now?`)) return;
  }
  clearInterval(tick);
  S.done = true;
  S.used = Math.round((Math.min(Date.now(), S.endAt || Date.now()) - S.t0) / 1000);
  save();
  if(S.mode === 'exam') pushHist(score());
  showResult();
}
function showResult(){
  clearInterval(tick);
  const r = score(), pass = r.net >= R.pass, att = r.c + r.w;
  const rows = T.sec.map(s => { const z = r.sec[s.k], a = z.c + z.w;
    return `<tr><td>${esc(s.name)}</td><td class="n">${z.n}</td><td class="n">${z.c}</td><td class="n">${z.w}</td><td class="n">${z.u}</td><td class="n">${f2(z.c - R.minus * z.w)}</td><td class="n">${a ? Math.round(100 * z.c / a) + '%' : '–'}</td></tr>`; }).join('');
  const mm = Math.floor(S.used / 60);
  view(`<div class="wrap"><p class="mut"><a href="index.html">← All tests</a></p>
  <h1>${esc(T.title)} · result</h1>
  <div class="card"><div class="big ${pass ? 'pass' : 'fail'}">${f2(r.net)} <span style="font-size:20px">/ ${N}</span></div>
   <p><b class="${pass ? 'pass' : 'fail'}">${pass ? 'Above the pass mark' : 'Below the pass mark'}</b> (pass = ${R.pass} net, ${pass ? 'margin +' : 'short by '}${f2(Math.abs(r.net - R.pass))})</p>
   <div class="stats"><div class="stat"><b>${r.c}</b><span>correct (+${r.c})</span></div><div class="stat"><b>${r.w}</b><span>wrong (−${f2(r.w * R.minus)})</span></div><div class="stat"><b>${r.u}</b><span>unanswered</span></div><div class="stat"><b>${att ? Math.round(100 * r.c / att) : 0}%</b><span>accuracy on attempted</span></div><div class="stat"><b>${mm} min</b><span>time used</span></div></div>
   <div class="warn">Guess audit: your wrong answers cost ${f2(r.w * R.minus)} marks. Skipping every one of them would have scored ${r.c}. Guess only after eliminating at least one option.</div></div>
  <div class="card"><h3>By section</h3><table><tr><th>Section</th><th class="n">Qs</th><th class="n">Right</th><th class="n">Wrong</th><th class="n">Skipped</th><th class="n">Net</th><th class="n">Accuracy</th></tr>${rows}</table></div>
  <div class="card actions"><button class="pri" data-a="flash-missed">Flashcards: missed + skipped (${r.w + r.u})</button><button data-a="rev-top">Jump to review</button><button data-a="home">Back to start</button></div>
  <h2 id="rev">Review</h2><div class="tabs" id="tabs"></div><div id="rl"></div></div>`);
  renderReview();
}
function renderReview(){
  const tabs = [['wrong', 'Wrong'], ['skip', 'Skipped'], ['mark', 'Marked'], ['ok', 'Correct'], ['all', 'All']];
  $('#tabs').innerHTML = tabs.map(t => `<button class="${filt === t[0] ? 'on' : ''}" data-a="filt" data-f="${t[0]}">${t[1]}</button>`).join('');
  let h = '', n = 0;
  T.q.forEach((q, i) => {
    const a = S.ans[i], st = a < 0 ? 'un' : (a === q.a ? 'ok' : 'bad');
    const show = filt === 'all' || (filt === 'wrong' && st === 'bad') || (filt === 'skip' && st === 'un') || (filt === 'ok' && st === 'ok') || (filt === 'mark' && S.mk[i]);
    if(!show) return; n++;
    h += `<div class="card rv ${st}"><div class="meta"><span class="tag">${esc(secOf(q.s).name)}</span><span>Q${i + 1}</span></div><div class="q">${esc(q.q)}</div>
      <div class="ans">Your answer: <b>${a < 0 ? 'skipped' : L[a] + '. ' + esc(q.o[a])}</b></div>
      <div class="ans">Correct: <b class="pass">${L[q.a]}. ${esc(q.o[q.a])}</b></div>${q.e ? `<div class="expl">${esc(q.e)}</div>` : ''}</div>`;
  });
  $('#rl').innerHTML = h || '<p class="mut">Nothing in this view.</p>';
}

/* ---------- flashcards ---------- */
function startFlash(idx, label){
  FS = {deck: idx, pos: 0, show: false, know: 0, miss: [], label: label || 'All questions'};
  renderFlash();
}
function renderFlash(){
  clearInterval(tick);
  if(!FS.deck.length){ view(`<div class="wrap"><div class="card"><p>Nothing to review.</p><button data-a="home">Back</button></div></div>`); return; }
  if(FS.pos >= FS.deck.length){
    view(`<div class="wrap"><h1>Deck finished</h1><div class="card"><p>${FS.know} known · ${FS.miss.length} missed (${FS.label}).</p>
      <div class="actions">${FS.miss.length ? '<button class="pri" data-a="flash-redo">Redo missed</button>' : ''}<button data-a="home">Back to start</button></div></div></div>`);
    return;
  }
  const i = FS.deck[FS.pos], q = T.q[i];
  view(`<div class="wrap"><p class="mut"><a href="#" data-a="home">← Back</a> · ${esc(FS.label)}</p>
   <div class="bar"><i style="width:${100 * FS.pos / FS.deck.length}%"></i></div>
   <div class="card fc"><div class="meta"><span class="tag">${esc(secOf(q.s).name)}</span><span>Card ${FS.pos + 1} of ${FS.deck.length}</span></div>
   <div class="q">${esc(q.q)}</div>
   ${FS.show ? `<div class="expl"><b>${L[q.a]}. ${esc(q.o[q.a])}</b>${q.e ? '<br>' + esc(q.e) : ''}</div>
     <div class="actions" style="margin-top:14px"><button class="pri" data-a="fk">I knew it</button><button data-a="fm">Missed it</button></div>`
   : `<div class="opts">${q.o.map((o, k) => `<div class="mut">${L[k]}. ${esc(o)}</div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="pri" data-a="fshow">Show answer</button></div>`}
   </div></div>`);
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a;
  if(a === 'home'){ e.preventDefault(); showStart(); }
  else if(a === 'start-exam') startTest('exam');
  else if(a === 'start-study') startTest('study');
  else if(a === 'start-flash') startFlash(T.q.map((_, i) => i), 'All questions');
  else if(a === 'resume') showTest();
  else if(a === 'reset'){ if(confirm('Erase answers and result for this test?')){ S = fresh(); save(); showStart(); } }
  else if(a === 'view-result') showResult();
  else if(a === 'opt') pick(+b.dataset.k);
  else if(a === 'go') go(+b.dataset.i);
  else if(a === 'prev') go(S.cur - 1);
  else if(a === 'next') go(S.cur + 1);
  else if(a === 'clear'){ S.ans[S.cur] = -1; save(); renderQ(); renderPal(); }
  else if(a === 'mark'){ S.mk[S.cur] = S.mk[S.cur] ? 0 : 1; save(); renderQ(); renderPal(); }
  else if(a === 'submit') finish(false);
  else if(a === 'filt'){ filt = b.dataset.f; renderReview(); }
  else if(a === 'rev-top') $('#rev').scrollIntoView();
  else if(a === 'flash-missed'){ const d = []; T.q.forEach((q, i) => { if(S.ans[i] !== q.a) d.push(i); }); startFlash(d, 'Missed + skipped'); }
  else if(a === 'fshow'){ FS.show = true; renderFlash(); }
  else if(a === 'fk'){ FS.know++; FS.pos++; FS.show = false; renderFlash(); }
  else if(a === 'fm'){ FS.miss.push(FS.deck[FS.pos]); FS.pos++; FS.show = false; renderFlash(); }
  else if(a === 'flash-redo') startFlash(FS.miss.slice(), 'Redo missed');
});
document.addEventListener('keydown', e => {
  if(!$('#qc') || !S.mode || S.done || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if('1234'.includes(k) && k) pick(+k - 1);
  else if('abcd'.includes(k) && k.length === 1) pick('abcd'.indexOf(k));
  else if(k === 'arrowright' || k === 'n') go(S.cur + 1);
  else if(k === 'arrowleft' || k === 'p') go(S.cur - 1);
  else if(k === 'm' && S.mode === 'exam'){ S.mk[S.cur] = S.mk[S.cur] ? 0 : 1; save(); renderQ(); renderPal(); }
});

if(S.done) showResult(); else if(S.mode && S.mode !== 'flash') showTest(); else showStart();
})();
</script>
</body>
</html>
